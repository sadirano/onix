[fzf.destination]
prompt = "Pick Folder > "
layout = "reverse-list"
preview = "dir /b \"{}\" 2>nul"
preview_window = "right:45%,border-left"
header = "Enter confirm  |  Esc manual"
height = "65%"

[fzf.sg]
prompt = "Search > "
layout = "default"
color = "fg:#d0d7de,bg:#161b22,hl:#58a6ff,fg+:#ffffff,bg+:#1f2937,hl+:#7ee787,pointer:#f778ba,marker:#ffa657,spinner:#79c0ff,header:#a5d6ff"
preview = "bat --style=numbers --color=always {1} --highlight-line {2}"
preview_window = "right:65%,border-left,+{2}/2"

[fzf.ff]
prompt = "Files > "
layout = "default"
preview = "bat --style=numbers --color=always --line-range=:250 {}"
preview_window = "right:60%,border-left"
