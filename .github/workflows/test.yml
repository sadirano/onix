name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        go: ['1.26']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test
        run: go test ./...

      # Executes the generated o.cmd/register.cmd under cmd.exe — the only
      # way to catch parse-level breakage (LF-vs-CRLF read-block bug) that
      # content string-matching in unit tests cannot see.
      - name: Verify generated cmd wrappers
        if: runner.os == 'Windows'
        run: pwsh -File scripts/verify-wrappers.ps1
