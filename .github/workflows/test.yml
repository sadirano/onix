name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Hot-path benchmark — informational only, not gated. If we ever want
      # to fail on a regression we'd parse the output and assert ns/op.
      - name: Bench
        run: go test -bench=. -benchmem -run=^$ ./...
