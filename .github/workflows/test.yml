name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        go: ['1.23', '1.24']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test
        run: go test ./...

      # Coverage gate — main package must stay at >=80%.
      # Runs once per matrix combo since the main package is platform-sensitive
      # (different exec paths on Windows vs Unix). bash is available on
      # windows-latest runners under the default shell wiring.
      - name: Coverage gate (main package >= 80%)
        shell: bash
        run: |
          go test -coverprofile=cover.out .
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          threshold=80
          echo "main package coverage: ${total}%"
          awk -v p="$total" -v t="$threshold" 'BEGIN { if (p+0 < t+0) { printf "main package below %s%% threshold (got %s%%)\n", t, p; exit 1 } }'

      # Hot-path benchmark — informational only, not gated.
      - name: Bench
        run: |
          go test -bench=. -benchmem -run=^$ ./... > bench_current.txt
          cat bench_current.txt

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Benchstat (current)
        run: benchstat bench_current.txt
