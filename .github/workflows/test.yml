name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        go: ['1.26']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test
        run: go test ./...

      # Executes the installed .exe wrappers by bare name under cmd.exe — the
      # only way to catch argv[0] dispatch, PATH resolution, and the
      # navigation-subshell wiring that unit tests cannot see end to end.
      - name: Verify generated exe wrappers
        if: runner.os == 'Windows'
        run: pwsh -File scripts/verify-wrappers.ps1
