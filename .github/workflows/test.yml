name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        go: ['1.26']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test
        run: go test ./...

      # Coverage gate — main package must stay at >=78%.
      # Runs once per matrix combo since the main package is platform-sensitive
      # (different exec paths on Windows vs Unix). bash is available on
      # windows-latest runners under the default shell wiring.
      #
      # 78% (not 80%) accommodates the platform spread: roughly a percentage
      # point of the main package is gated on runtime.GOOS, so the OS that
      # isn't currently running sees those branches as dead code.
      - name: Coverage gate (main package >= 78%)
        shell: bash
        run: |
          go test -coverprofile=cover.out .
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          threshold=78
          echo "main package coverage: ${total}%"
          awk -v p="$total" -v t="$threshold" 'BEGIN { if (p+0 < t+0) { printf "main package below %s%% threshold (got %s%%)\n", t, p; exit 1 } }'

      # Hot-path benchmark — compare against main and fail on >20% slowdown for BenchmarkHotPath_LookupOnly
      - name: Bench (current)
        shell: bash
        run: |
          go test -bench=BenchmarkHotPath_LookupOnly -benchmem -run=^$ ./... > bench_current.txt
          cat bench_current.txt

      - name: Fetch baseline files
        shell: bash
        run: |
          set -eux
          # Try to fetch baseline files from bench/baseline branch
          git fetch origin bench/baseline || true
          if git ls-remote --heads origin bench/baseline | grep -q bench/baseline; then
            # checkout baseline files into workspace
            git checkout origin/bench/baseline -- bench_baseline.txt bench_baseline_resolver.txt || true
          else
            echo "bench/baseline branch or files not found; generating baseline from origin/main"
            git fetch origin main
            git worktree add --detach baseline origin/main
            pushd baseline
            go test -bench=BenchmarkHotPath_LookupOnly -benchmem -run=^$ ./... > ../bench_baseline.txt
            popd
            rm -rf baseline
          fi

      - name: Compare benches and gate
        shell: bash
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          benchstat bench_baseline.txt bench_current.txt | tee benchstat.txt
          pct=$(benchstat bench_baseline.txt bench_current.txt | awk '/BenchmarkHotPath_LookupOnly/ {print $4; exit}')
          pct=${pct//+/}
          pct=${pct//%/}
          if [ -z "$pct" ]; then echo "BenchmarkHotPath_LookupOnly not present in benchstat output"; exit 1; fi
          echo "$pct" | awk -v threshold=20 '{
            gsub(/[^0-9.-]/,"",$1);
            if ($1+0 > threshold) { printf("Regression %.2f%% > %.2f%% threshold\n",$1,threshold); exit 1 }
            else { printf("OK: change %.2f%% <= %.2f%% threshold\n",$1,threshold); exit 0 }
          }'
