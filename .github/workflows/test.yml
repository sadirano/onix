name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        go: ['1.26']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test
        run: go test ./...

      # Coverage gate — main package must stay at >=78%.
      # Runs once per matrix combo since the main package is platform-sensitive
      # (different exec paths on Windows vs Unix). bash is available on
      # windows-latest runners under the default shell wiring.
      #
      # 78% (not 80%) accommodates the platform spread: roughly a percentage
      # point of the main package is gated on runtime.GOOS, so the OS that
      # isn't currently running sees those branches as dead code.
      - name: Coverage gate (main package >= 78%)
        shell: bash
        run: |
          go test -coverprofile=cover.out .
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          threshold=78
          echo "main package coverage: ${total}%"
          awk -v p="$total" -v t="$threshold" 'BEGIN { if (p+0 < t+0) { printf "main package below %s%% threshold (got %s%%)\n", t, p; exit 1 } }'

      # Hot-path benchmark — generate baseline from origin/main and compare
      # (platform-specific baselines are not comparable; always build baseline fresh)
      - name: Bench (current)
        shell: bash
        run: |
          # -count=3 keeps single-sample noise out of benchstat's significance
          # filter (it reports "~" on count=1 and the gate then skips silently).
          go test -bench=BenchmarkHotPath_LookupOnly -benchmem -count=3 -run=^$ ./... > bench_current.txt
          cat bench_current.txt

      - name: Bench (baseline from main)
        shell: bash
        run: |
          git fetch origin main
          git worktree add --detach baseline origin/main
          cd baseline
          go test -bench=BenchmarkHotPath_LookupOnly -benchmem -count=3 -run=^$ ./... > ../bench_baseline.txt
          cd ..
          rm -rf baseline

      - name: Compare benches and gate
        shell: bash
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          benchstat bench_baseline.txt bench_current.txt | tee benchstat.txt
          # Extract the % change for HotPath_LookupOnly and gate on 20% slowdown.
          # awk-only (no `bc`): Git Bash on the windows-latest runner ships
          # without `bc`, and awk handles both extraction and comparison.
          pct=$(benchstat bench_baseline.txt bench_current.txt 2>/dev/null | grep 'HotPath_LookupOnly' | head -1 | awk '{for(i=1;i<=NF;i++) if($i ~ /^[+-]?[0-9.]+%$/) print $i}' | head -1)
          if [ -z "$pct" ]; then
            echo "::warning::could not extract percentage from benchstat; soft-pass (treat as no regression)"
            exit 0
          fi
          pct_num=$(echo "$pct" | tr -d '+%')
          threshold=20
          awk -v p="$pct_num" -v t="$threshold" 'BEGIN { exit (p+0 > t+0) ? 1 : 0 }'
          if [ $? -ne 0 ]; then
            echo "Regression: $pct > ${threshold}% threshold"
            exit 1
          else
            echo "OK: change $pct <= ${threshold}% threshold"
            exit 0
          fi
