name: Lint

on:
  push:
    branches: [ main, refactor/onix-rework ]
  pull_request:
    branches: [ main, refactor/onix-rework ]

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@2226d7dc06d0477357c97665323d33853a27e352  # v9.1.0
        with:
          version: latest

  format:
    name: check-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest
      - name: Run gofumpt
        run: |
          # Use a simple check to see if gofumpt would change anything
          test -z "$(gofumpt -l .)"
