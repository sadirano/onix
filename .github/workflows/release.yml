name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -ldflags "-X main.buildVersion=${{ github.ref_name }}" -o onix.exe .

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item onix.exe dist\

          # Themes must be flat next to onix.exe (code globs the exe dir directly)
          Get-ChildItem themes\*.toml | Copy-Item -Destination dist\

          $zip = "onix-${{ github.ref_name }}-windows-amd64.zip"
          Compress-Archive -Path dist\* -DestinationPath $zip
          Write-Host "Created $zip"

          # Print SHA256 for updating the Scoop manifest hash after release
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: onix-${{ github.ref_name }}-windows-amd64.zip
          generate_release_notes: true
