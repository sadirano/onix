name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: .exe
            pkg_cmd: powershell
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ""
            pkg_cmd: bash
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: ""
            pkg_cmd: bash
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-go@4a3601113188429b0e3728a4481356a2179ad73c  # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build
        run: >
          go build
          -trimpath
          -ldflags "-s -w -X main.buildVersion=${{ github.ref_name }}"
          -o onix${{ matrix.suffix }}
          .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item onix.exe dist\
          $zip = "onix-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          Compress-Archive -Path dist\* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash"

      - name: Package (Linux)
        if: matrix.goos == 'linux'
        run: |
          mkdir -p dist
          cp onix dist/
          tar -czf "onix-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" -C dist .
          sha256sum "onix-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" || true

      - name: Release
        uses: softprops/action-gh-release@b4309336664669647698a813f5ef51888af4ad44  # v3.0.0
        with:
          files: |
            onix-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip
            onix-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          generate_release_notes: true
